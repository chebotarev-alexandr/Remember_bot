services:
  bot:
    build: .
    restart: unless-stopped
    command: python manage.py runbot
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - ./data:/app/data
    depends_on:
      - migrate

  web:
    build: .
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - ./data:/app/data
    ports:
      - "8091:8000"
    depends_on:
      - migrate

  migrate:
    build: .
    command: python manage.py migrate --noinput
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - ./data:/app/data
    restart: "no"
